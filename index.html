<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<title>Caderneta de Cashback</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: uma coluna de celular (até 520px), cabeçalho fixo, conteúdo que rola, abas embaixo.
   A peça central é o cupom de papel: é ele que mostra o cashback antes de registrar. */
:root{
  --paper:#eef1f6; --card:#ffffff; --ink:#14213d; --ink-2:#5a6781; --line:#d5dce8;
  --pen:#1d4ed8; --on-pen:#ffffff; --pen-soft:#e3eafc;
  --zap:#117a43; --on-zap:#ffffff;
  --warn:#9a5700; --warn-bg:#fff1d0; --bad:#b3261e; --good:#117a43;
  --ticket:#fffbea; --ticket-ink:#1b2333; --ticket-line:#c9c2a3;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1320; --card:#161f31; --ink:#e9edf6; --ink-2:#9aa6bd; --line:#2a3650;
    --pen:#86a8ff; --on-pen:#0b1530; --pen-soft:#1c2a4d;
    --zap:#45cf85; --on-zap:#06240f;
    --warn:#f3bd55; --warn-bg:#3a2b08; --bad:#ff8f85; --good:#45cf85;
    --ticket:#f6f0d8; --ticket-ink:#1b2333; --ticket-line:#b9b08c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1320; --card:#161f31; --ink:#e9edf6; --ink-2:#9aa6bd; --line:#2a3650;
  --pen:#86a8ff; --on-pen:#0b1530; --pen-soft:#1c2a4d;
  --zap:#45cf85; --on-zap:#06240f;
  --warn:#f3bd55; --warn-bg:#3a2b08; --bad:#ff8f85; --good:#45cf85;
  --ticket:#f6f0d8; --ticket-ink:#1b2333; --ticket-line:#b9b08c;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.money,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* cabeçalho */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.top h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.top .sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.top .hoje{font-family:var(--mono);font-size:13px;color:var(--ink-2);white-space:nowrap;padding-bottom:3px}

main{flex:1;overflow-y:auto;padding:4px 20px 28px;display:flex;flex-direction:column;gap:16px}
section.view{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}

/* avisos */
.aviso{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:12px;font-size:14.5px}
.aviso.ex{background:var(--pen-soft);color:var(--ink)}
.aviso.venc{background:var(--warn-bg);color:var(--warn);font-weight:500;text-decoration:none}
.aviso a{color:inherit;font-weight:600}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--pen);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* formulário */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label,.rotulo{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.campo input[type=text],.campo input[type=tel]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:17px}
.campo input:focus{border-color:var(--pen);outline:none;box-shadow:0 0 0 3px var(--pen-soft)}
.campo input.valor{font-family:var(--mono);font-size:22px;font-weight:500}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--mono)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.comcampo{display:flex;align-items:center;gap:8px}
.comcampo input{width:84px !important;text-align:right;font-family:var(--mono)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--pen);flex:none}
.saldo-box{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;background:var(--pen-soft);border:1.5px dashed var(--pen)}
.saldo-box strong{font-family:var(--mono);font-weight:500;font-size:18px}
.erro{color:var(--bad);font-size:14.5px;font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:12px;border:0;font-weight:600;font-size:16.5px;cursor:pointer;text-decoration:none;text-align:center}
.btn.pen{background:var(--pen);color:var(--on-pen)}
.btn.zap{background:var(--zap);color:var(--on-zap)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.mini{padding:9px 13px;font-size:14.5px;border-radius:10px}
.btn.cheio{width:100%}
.btn svg{flex:none}

/* cupom */
.ticket{position:relative;background:var(--ticket);color:var(--ticket-ink);font-family:var(--mono);font-size:14px;padding:16px 16px 14px;margin-bottom:6px;border-radius:4px 4px 0 0;box-shadow:0 1px 0 var(--ticket-line),0 8px 20px -14px rgba(10,20,50,.5)}
.ticket::after{content:"";position:absolute;left:0;right:0;top:100%;height:6px;background:linear-gradient(135deg,var(--ticket) 25%,transparent 25%),linear-gradient(225deg,var(--ticket) 25%,transparent 25%);background-size:12px 12px}
.ticket .loja{font-weight:500;text-transform:uppercase;letter-spacing:.08em;text-align:center;overflow-wrap:anywhere}
.ticket hr{border:0;border-top:1.5px dashed var(--ticket-line);margin:10px 0}
.ticket .lin{display:flex;align-items:baseline;gap:6px}
.ticket .lin + .lin{margin-top:4px}
.ticket .pts{flex:1;border-bottom:1.5px dotted var(--ticket-line);transform:translateY(-3px);min-width:12px}
.ticket .total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ticket .total b{font-size:28px;font-weight:500;letter-spacing:-.02em}
.ticket .vale{margin-top:4px;font-size:13px;opacity:.75}
.ticket.vazio .total b{opacity:.35}

/* clientes */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.seg .n{font-family:var(--mono);font-weight:400;opacity:.8}
.lista{display:flex;flex-direction:column;gap:10px}
.cli{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--line)}
.cli.urg{border-left-color:var(--warn)}
.cli.sum{border-left-color:var(--ink-2)}
.cli .cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cli .nome{font-weight:600;font-size:16.5px;overflow-wrap:anywhere}
.cli .fone{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.cli .sal{font-family:var(--mono);font-size:18px;font-weight:500;white-space:nowrap}
.cli .sal.zero{color:var(--ink-2);font-size:14px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.cinza{background:var(--paper);color:var(--ink-2)}
.pill.ok{background:var(--pen-soft);color:var(--pen)}
.cli .st{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.cli .acoes{display:flex;gap:8px;flex-wrap:wrap}
.vazio-msg{padding:28px 16px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line);border-radius:14px}

/* painel */
.destaque{background:var(--ink);color:var(--card);border-radius:18px;padding:20px}
.destaque .big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.destaque p{margin:8px 0 0;font-size:15px;opacity:.85;max-width:34ch}
.destaque .raz{margin-top:12px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--card) 25%,transparent);font-size:14.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:500;white-space:nowrap}
.stat .l{font-size:13px;color:var(--ink-2);margin-top:2px}
.graf{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.graf .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.graf .val{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.graf .trilho{width:100%;height:110px;display:flex;align-items:flex-end;border-bottom:1.5px solid var(--line)}
.graf .barra{width:100%;background:var(--line);border-radius:5px 5px 0 0;display:flex;align-items:flex-end;min-height:2px}
.graf .ret{width:100%;background:var(--pen);border-radius:5px 5px 0 0}
.graf .dia{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hist{display:flex;flex-direction:column}
.hist .h{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.hist .h:first-child{border-top:0}
.hist .q{color:var(--ink-2);font-size:13px}
.hist .d{text-align:right}

/* abas */
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-size:12.5px;font-weight:600}
nav.tabs a[aria-current=page]{color:var(--pen);background:var(--pen-soft)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:var(--card);font-family:var(--mono);font-size:11.5px;line-height:18px;text-align:center}

/* folha de confirmação */
.overlay{position:fixed;inset:0;background:rgba(8,14,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.bolha{background:var(--paper);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.ok-tit{display:flex;align-items:center;gap:10px}
.ok-tit .bola{width:30px;height:30px;border-radius:50%;background:var(--good);color:var(--card);display:grid;place-items:center;flex:none}
.pilha{display:flex;flex-direction:column;gap:8px}
@media (min-width:560px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (max-width:360px){.duas{grid-template-columns:1fr}.destaque .big{font-size:32px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="h-loja">Minha Loja</h1>
      <div class="sub">Caderneta de cashback</div>
    </div>
    <div class="hoje" id="h-hoje"></div>
  </header>

  <main id="main">
    <div class="aviso ex" id="av-exemplo" hidden>
      <span>Estes clientes são <strong>exemplos</strong> para você testar.</span>
      <button class="linkbtn" data-acao="zerar" id="btn-zerar-topo">Começar do zero</button>
    </div>

    <!-- VENDA -->
    <section class="view" id="v-venda">
      <a class="aviso venc" id="av-venc" href="#clientes" hidden></a>
      <form class="card" id="form-venda" autocomplete="off" novalidate>
        <div class="campo">
          <label for="f-fone">WhatsApp do cliente</label>
          <input type="tel" id="f-fone" inputmode="numeric" placeholder="(11) 98765-4321">
        </div>
        <div class="campo">
          <label for="f-nome">Nome</label>
          <input type="text" id="f-nome" placeholder="Nome do cliente">
        </div>
        <div class="saldo-box" id="saldo-box" hidden>
          <div><span id="saldo-txt"></span></div>
          <label class="check"><input type="checkbox" id="f-usar" checked><span>Usar o saldo nesta compra</span></label>
        </div>
        <div class="campo">
          <label for="f-valor">Valor da venda (R$)</label>
          <input type="text" class="valor" id="f-valor" inputmode="decimal" placeholder="0,00">
        </div>
        <div class="duas">
          <div class="campo">
            <label for="f-pct">Cashback</label>
            <div class="comcampo"><input type="text" id="f-pct" inputmode="decimal"><span class="muted">%</span></div>
            <div class="chips" id="chips-pct"></div>
          </div>
          <div class="campo">
            <label for="f-dias">Vale por</label>
            <div class="comcampo"><input type="text" id="f-dias" inputmode="numeric"><span class="muted">dias</span></div>
            <div class="chips" id="chips-dias"></div>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="f-consent"><span>Cliente autorizou receber mensagens no WhatsApp</span></label>
        <div id="ticket-previa"></div>
        <div class="erro" id="f-erro" role="alert" hidden></div>
        <button class="btn pen cheio" type="submit">Registrar venda</button>
      </form>
    </section>

    <!-- CLIENTES -->
    <section class="view" id="v-clientes" hidden>
      <div class="seg" id="seg-cli" role="group" aria-label="Filtro de clientes"></div>
      <div class="small muted" id="cli-dica"></div>
      <div class="lista" id="cli-lista"></div>
    </section>

    <!-- PAINEL -->
    <section class="view" id="v-painel" hidden></section>

    <!-- AJUSTES -->
    <section class="view" id="v-ajustes" hidden>
      <div class="card">
        <h2>Sua loja</h2>
        <div class="campo">
          <label for="a-nome">Nome da loja (aparece nas mensagens)</label>
          <input type="text" id="a-nome" maxlength="40">
        </div>
        <div class="duas">
          <div class="campo">
            <label for="a-pct">Cashback padrão</label>
            <div class="comcampo"><input type="text" id="a-pct" inputmode="decimal"><span class="muted">%</span></div>
          </div>
          <div class="campo">
            <label for="a-dias">Validade padrão</label>
            <div class="comcampo"><input type="text" id="a-dias" inputmode="numeric"><span class="muted">dias</span></div>
          </div>
        </div>
        <p class="small muted" style="margin:0">Você pode mudar o percentual e a validade em cada venda.</p>
      </div>
      <div class="card">
        <h2>Lembretes</h2>
        <div class="duas">
          <div class="campo">
            <label for="a-aviso">Avisar vencimento com</label>
            <div class="comcampo"><input type="text" id="a-aviso" inputmode="numeric"><span class="muted">dias antes</span></div>
          </div>
          <div class="campo">
            <label for="a-sumido">Cliente sumido depois de</label>
            <div class="comcampo"><input type="text" id="a-sumido" inputmode="numeric"><span class="muted">dias</span></div>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>Dados</h2>
        <p class="small muted" style="margin:0" id="a-guarda"></p>
        <button class="btn ghost" data-acao="zerar" id="btn-zerar">Apagar tudo e começar do zero</button>
      </div>
    </section>
  </main>

  <nav class="tabs" aria-label="Seções">
    <a href="#venda" data-tab="venda"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Venda</a>
    <a href="#clientes" data-tab="clientes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 010 6.4M18.5 14.8c1.7.8 2.7 2.5 3 5.2"/></svg>Clientes<span class="badge" id="badge-cli" hidden></span></a>
    <a href="#painel" data-tab="painel"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>Painel</a>
    <a href="#ajustes" data-tab="ajustes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Ajustes</a>
  </nav>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-tit" tabindex="-1"></div>
</div>

<script>
/*LOGICA-INICIO*/
const DIA = 86400000;
const p2 = n => String(n).padStart(2, '0');

function centavos(txt) {
  let s = String(txt == null ? '' : txt).trim().replace(/[^\d.,]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/\.\d{3}(\.|$)/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isFinite(n) ? Math.round(n * 100) : 0;
}
function brl(c) {
  const neg = c < 0; c = Math.abs(Math.round(c));
  const r = Math.floor(c / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '-' : '') + 'R$ ' + r + ',' + p2(c % 100);
}
function numero(txt) {
  const n = parseFloat(String(txt == null ? '' : txt).replace(',', '.').replace(/[^\d.]/g, ''));
  return isFinite(n) ? n : NaN;
}
const pctTxt = p => String(p).replace('.', ',');
function fimDoDia(ts) { const d = new Date(ts); d.setHours(23, 59, 59, 999); return d.getTime(); }
function vencimento(ts, dias) { return fimDoDia(fimDoDia(ts) + dias * DIA - 3600000); }
function dataCurta(ts) { const d = new Date(ts); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1); }
function dataLonga(ts) { return dataCurta(ts) + '/' + new Date(ts).getFullYear(); }
function diasEntre(a, b) { return Math.round((fimDoDia(b) - fimDoDia(a)) / DIA); }

function normFone(s) {
  let d = String(s == null ? '' : s).replace(/\D/g, '');
  if (d.length > 11 && d.startsWith('55')) d = d.slice(2);
  return d.slice(0, 11);
}
const foneValido = d => d.length === 10 || d.length === 11;
function fmtFone(d) {
  if (d.length < 3) return d;
  const ddd = d.slice(0, 2), r = d.slice(2);
  if (r.length <= 4) return '(' + ddd + ') ' + r;
  if (r.length <= 8) return '(' + ddd + ') ' + r.slice(0, 4) + '-' + r.slice(4);
  return '(' + ddd + ') ' + r.slice(0, 5) + '-' + r.slice(5, 9);
}

  h += '<div class="card"><h2>Últimas vendas</h2><div class="hist">' + (ult.length ? ult.map(v => {
    const c = st.clientes[v.fone] || { nome: fmtFone(v.fone) };
    return '<div class="h"><div><div>' + esc(c.nome) + '</div><div class="q">' + dataCurta(v.data) + (v.resgate > 0 ? ' · usou ' + brl(v.resgate) : '') + '</div></div><div class="d"><div class="money">' + brl(v.valor) + '</div><div class="q money">+' + brl(v.cashback) + '</div></div></div>';
  }).join('') : '<div class="muted">Nenhuma venda registrada ainda.</div>') + '</div></div>';
  $('v-painel').innerHTML = h;
}

/* ---------- ajustes ---------- */
function renderAjustes() {
  $('a-nome').value = st.loja.nome; $('a-pct').value = pctTxt(st.loja.pct); $('a-dias').value = st.loja.dias;
  $('a-aviso').value = st.loja.aviso; $('a-sumido').value = st.loja.sumido;
  $('a-guarda').textContent = guardaOk ? 'Este protótipo guarda os dados só neste aparelho e neste navegador. Em outro celular a caderneta começa vazia.'
    : 'Este navegador não deixou guardar os dados. Eles somem quando você fechar a página.';
}
function gravarAjustes() {
  const nome = $('a-nome').value.trim(); if (nome) st.loja.nome = nome;
  const pct = numero($('a-pct').value); if (pct >= 0 && pct <= 100) st.loja.pct = pct;
  const lim = (id, min, max, campo) => { const n = Math.round(numero($(id).value)); if (n >= min && n <= max) st.loja[campo] = n; };
  lim('a-dias', 1, 365, 'dias'); lim('a-aviso', 1, 60, 'aviso'); lim('a-sumido', 7, 365, 'sumido');
  salvar(); geral();
  if (!$('f-fone').value && !$('f-valor').value) limparVenda(); else { montarChips(); atualizarVenda(); }
}

/* ---------- geral ---------- */
function geral() {
  const agora = Date.now(), n = listaVencendo(st, agora).length;
  $('h-loja').textContent = st.loja.nome;
  $('h-hoje').textContent = dataLonga(agora);
  $('av-exemplo').hidden = !st.exemplo;
  $('badge-cli').hidden = !n; $('badge-cli').textContent = n;
  $('av-venc').hidden = !n;
  $('av-venc').textContent = n === 1 ? '1 cliente com cashback vencendo. Ver e lembrar →' : n + ' clientes com cashback vencendo. Ver e lembrar →';
}
const ABAS = ['venda', 'clientes', 'painel', 'ajustes'];
function rota() {
  const a = ABAS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'venda';
  ABAS.forEach(x => { $('v-' + x).hidden = x !== a; });
  document.querySelectorAll('nav.tabs a').forEach(l => { if (l.dataset.tab === a) l.setAttribute('aria-current', 'page'); else l.removeAttribute('aria-current'); });
  if (a === 'clientes') renderClientes();
  if (a === 'painel') renderPainel();
  if (a === 'ajustes') renderAjustes();
  desarmarZerar(); geral(); $('main').scrollTop = 0;
}
function abrirSheet(html) {
  $('sheet').innerHTML = html; $('overlay').hidden = false;
  const f = $('sheet').querySelector('[data-foco]'); (f || $('sheet')).focus();
}
function fecharSheet() { $('overlay').hidden = true; $('sheet').innerHTML = ''; }
function desarmarZerar() {
  zerarArmado = 0; $('btn-zerar').textContent = 'Apagar tudo e começar do zero'; $('btn-zerar-topo').textContent = 'Começar do zero';
}

document.addEventListener('click', ev => {
  const chip = ev.target.closest('[data-chip]');
  if (chip) { $(chip.dataset.chip === 'chips-pct' ? 'f-pct' : 'f-dias').value = pctTxt(chip.dataset.v); atualizarVenda(); return; }
  const fl = ev.target.closest('[data-filtro]');
  if (fl) { filtro = fl.dataset.filtro; renderClientes(); return; }
  const zap = ev.target.closest('[data-zap]');
  if (zap) {
    const c = st.clientes[zap.dataset.zap];
    if (c) { c.avisado = Date.now(); salvar(); }
    setTimeout(() => { if (!$('v-clientes').hidden) renderClientes(); }, 600);
    return;
  }
  if (ev.target === $('overlay')) { fecharSheet(); return; }
  const b = ev.target.closest('[data-acao]'); if (!b) return;
  const acao = b.dataset.acao;
  if (acao === 'fechar') { fecharSheet(); if (!$('v-venda').hidden) $('f-fone').focus(); }
  else if (acao === 'copiar') {
    const t = $('msg-txt').textContent;
    const falhou = () => { b.textContent = 'Não deu para copiar. Selecione o texto acima.'; };
    try { navigator.clipboard.writeText(t).then(() => { b.textContent = 'Mensagem copiada'; }, falhou); } catch (e) { falhou(); }
  }
  else if (acao === 'vender') {
    limparVenda(); $('f-fone').value = fmtFone(b.dataset.fone); atualizarVenda();
    location.hash = 'venda'; setTimeout(() => $('f-valor').focus(), 50);
  }
  else if (acao === 'zerar') {
    if (zerarArmado && Date.now() - zerarArmado < 5000) {
      st = novoEstado(); salvar(); desarmarZerar(); limparVenda(); rota();
    } else { desarmarZerar(); zerarArmado = Date.now(); b.textContent = 'Toque de novo para apagar tudo'; }
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('overlay').hidden) fecharSheet(); });
$('f-fone').addEventListener('input', () => { const d = normFone($('f-fone').value); $('f-fone').value = fmtFone(d); atualizarVenda(); });
$('f-nome').addEventListener('input', () => { nomeAuto = false; });
['f-valor', 'f-pct', 'f-dias', 'f-usar'].forEach(id => $(id).addEventListener('input', () => { $('f-erro').hidden = true; atualizarVenda(); }));
$('form-venda').addEventListener('submit', enviarVenda);
['a-nome', 'a-pct', 'a-dias', 'a-aviso', 'a-sumido'].forEach(id => $(id).addEventListener('change', gravarAjustes));
window.addEventListener('hashchange', rota);

limparVenda(); rota();
</script>
</body>
</html>
